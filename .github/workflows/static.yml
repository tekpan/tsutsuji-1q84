name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp 1Q84_L1_grammar_examples.html _site/index.html

      - name: Upload artifact
        id: site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # Use the upload's exact ID: artifact-name discovery returned no results
      # even though GitHub confirmed that the github-pages upload succeeded.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.site.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('The upload did not return a valid Pages artifact ID');
            }
            const idToken = await core.getIDToken();
            const { data: deployment } = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              {
                ...context.repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: idToken
              }
            );
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('Pages did not return a deployment ID');
            const pageUrl = deployment.page_url;
            if (pageUrl) core.setOutput('page_url', pageUrl);
            core.info('Created Pages deployment ' + deploymentId);
            const failures = new Set([
              'deployment_failed', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_lost'
            ]);
            for (let attempt = 0; attempt < 90; attempt++) {
              const { data: state } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                { ...context.repo, deployment_id: deploymentId }
              );
              core.info('Pages deployment status: ' + state.status);
              if (state.status === 'succeed') {
                await core.summary.addHeading('Report published')
                  .addLink('Open the grammar report', pageUrl).write();
                return;
              }
              if (failures.has(state.status)) {
                throw new Error('Pages deployment failed: ' + state.status);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Timed out waiting for the Pages deployment');
